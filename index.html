/* ===== الإعلانات =====

   provider: ضع هنا كود إعلانك الحقيقي. الصيغة: provider=(kind,done)=>{...} حيث kind هو 'r' (مكافأة) أو 'i' (بين الجولات)
   واستدعِ done(true) عند اكتمال المشاهدة أو done(false) عند الفشل/الإغلاق. إذا تُرك null يظهر إعلان تجريبي. */
const ADCFG={
  every:3,
  reward:100,
  secs:15,
  provider:null,
  vids:['round-ad-video.mp4','reward-video.mp4']

 /* vids: قائمة فيديوهات الإعلان، يُختار منها فيديو عشوائي في كل مرة (للمكافأة وللجولات) */
let adOn=false,adT=null,adCb=null,adKind='i',adLeft=0;
function adDone(ok){clearInterval(adT);adOn=false;$('ad').style.display='none';$('ad').innerHTML='';const c=adCb;adCb=null;if(c)c(ok)}
function adDraw(){const r=adKind=='r',l=adLeft;$('ad').innerHTML=`<div class="adbox"><small>إعلان تجريبي — مكان الإعلان الحقيقي</small><b>📺 ADVERTISEMENT</b><div class="adc">${l>0?l:'✔'}</div></div>`+(r?(l>0?`<p>شاهد حتى النهاية لتحصل على ${ADCFG.reward} 🪙</p><button style="background:#555" onclick="adDone(0)">إغلاق (بدون مكافأة)</button>`:`<button style="background:#2e9e6a" onclick="adDone(1)">استلم ${ADCFG.reward} 🪙</button>`):(ADCFG.secs-l>=3||l<=0?`<button onclick="adDone(1)">متابعة ▶</button>`:`<p>يمكنك التخطي بعد قليل…</p>`))}
function showAd(kind,cb){if(adOn)return;adOn=true;adCb=cb;adKind=kind;
if(ADCFG.provider){try{ADCFG.provider(kind,adDone)}catch(e){adDone(0)}return}
if(ADCFG.vids.length){vidAd(kind);return}
adLeft=ADCFG.secs;$('ad').style.display='flex';adDraw();clearInterval(adT);adT=setInterval(()=>{if(adLeft>0)adLeft--;adDraw()},1000)}

function vidAd(kind){
  const vi=kind==='r'?1:0;
  const a=$('ad');
  let finished=false;

  a.style.display='flex';
  a.style.position='fixed';
  a.style.inset='0';
  a.style.width='100vw';
  a.style.height='100vh';
  a.style.background='#000';
  a.style.zIndex='99999';

  a.innerHTML=`
    <video id="av"
      autoplay
      playsinline
      preload="auto"
      style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000">
      <source src="${ADCFG.vids[vi]}" type="video/mp4">
    </video>
    <button id="adClose"
      style="display:none;position:absolute;top:15px;right:15px;width:48px;height:48px;min-width:48px;padding:0;border-radius:50%;font-size:27px;z-index:10">
      ✕
    </button>
  `;

  const v=$('av');
  const close=$('adClose');

  v.controls=false;
  v.loop=false;
  v.muted=false;

  v.onended=()=>{
    if(finished)return;
    finished=true;
    v.pause();
    close.style.display='block';
  };

  v.onerror=()=>{
    if(!finished){
      finished=true;
      adDone(false);
      alert('تعذر تشغيل الفيديو');
    }
  };

  close.onclick=()=>{
    if(finished)adDone(true);
  };

  const p=v.play();
  if(p && p.catch){
    p.catch(()=>{
      alert('اضغط تشغيل الفيديو للسماح بالصوت');
    });
  }
}



async function rewardAd(sc) {
  showAd('r', async ok => {
    if (!ok) {
      show(sc);
      return;
    }

    try {
      if (!user) throw new Error("سجّل الدخول أولاً");

      const ref = db.ref("users/" + user.uid + "/inventory");

      const result = await ref.transaction(data => {
        if (!data) return;

        data.coins = Number(data.coins || 0) + ADCFG.reward;
        data.updatedAt = firebase.database.ServerValue.TIMESTAMP;

        return data;
      });

      if (!result.committed) {
        throw new Error("تعذرت إضافة المكافأة");
      }

      S.c = Number(result.snapshot.val().coins);
      save();
      snd('coin');
      alert('تمت إضافة 100 عملة');

    } catch (e) {
      alert('تعذرت إضافة المكافأة: ' + e.message);
    }

    show(sc);
  });
}

async function gift() {
  const d = new Date().toDateString();

  try {
    if (!user) throw new Error("سجّل الدخول أولاً");

    const ref = db.ref("users/" + user.uid + "/inventory");

    const result = await ref.transaction(data => {
      if (!data || data.giftDate === d) return;

      data.coins = Number(data.coins || 0) + 50;
      data.giftDate = d;
      data.updatedAt = firebase.database.ServerValue.TIMESTAMP;

      return data;
    });

    if (result.committed) {
      S.c = Number(result.snapshot.val().coins);
      S.gd = d;
      save();
      snd('coin');
    } else {
      S.gd = d;
      alert("لقد حصلت على هدية اليوم بالفعل");
    }

  } catch (e) {
    alert("تعذر استلام الهدية: " + e.message);
  }

  show('home');
}

const HAT_PRICE=[0,50,50,100,100,100,100,200,200,200,200,350];

  return (S.hOwn||[0]).filter(k=>Number.isInteger(k)&&HATS[k]);

async function buyHat(k){
  if(!Number.isInteger(k)||!HATS[k]||ownedHats().includes(k))return;

  const p=HAT_PRICE[k];

  if(S.c<p){
    alert('لا تملك عملات كافية!');
    return;
  }

  if(!confirm(`شراء ${HATS[k][1]} مقابل ${p} عملة؟`))return;

  const oldCoins=S.c;
  const oldHats=[...S.hOwn];

  S.c-=p;
  S.hOwn.push(k);
  save();

  if(user){
    const saved=await persistInventory();

    if(!saved){
      S.c=oldCoins;
      S.hOwn=oldHats;
      save();
      show('pk');
      return;
    }
  }

  show('pk');
}

buy = async function(k) {
  try {
    if (!user) throw new Error("سجّل الدخول أولاً");

    const price = Number(WEAPON_PRICES[k]);
    if (!Number.isFinite(price) || price < 0)
      throw new Error("سعر السلاح غير صحيح");

    const ref = db.ref("users/" + user.uid + "/inventory");

    const result = await ref.transaction(data => {
      if (!data) return;

      let weapons = Array.isArray(data.weapons)
        ? data.weapons
        : Object.values(data.weapons || {});

      weapons = weapons.map(Number);

      if (weapons.includes(Number(k))) return data;
      if (Number(data.coins) < price) return;

      data.coins = Number(data.coins) - price;
      data.weapons = [...weapons, Number(k)];
      data.updatedAt = firebase.database.ServerValue.TIMESTAMP;

      return data;
    });

    if (!result.committed)
      throw new Error("العملات غير كافية أو تعذر الشراء");

    const data = result.snapshot.val();

    S.c = Number(data.coins);
    S.own = Array.isArray(data.weapons)
      ? data.weapons.map(Number)
      : Object.values(data.weapons || {}).map(Number);

    S.w = Number(k);
